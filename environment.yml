# Hexapod-MJLab 开发环境一键复现（conda env 名：hp_mjlab）。
# 版本为开发验证时的锁定组合；宽松约束见 pyproject.toml。
# 本次基线验证环境实际为 torch 2.11.0+cu130 / CUDA runtime 13.0。
# 此处锁定发行版本，不锁定 CUDA wheel 变体；安装后须核对 torch.__version__、
# torch.version.cuda，并在目标 GPU 上运行有限工程检查。
name: hp_mjlab
channels:
  - defaults
dependencies:
  - python=3.12
  - pip
  - pip:
      - numpy==2.5.3
      - torch==2.11.0
      - warp-lang==1.17.0
      - scipy==1.18.1
      - trimesh==5.1.0
      - mujoco==3.11.0
      - mujoco-warp==3.11.0
      - mjlab==1.6.0
      - rsl-rl-lib==5.4.2
      - tensorboard==2.21.0
      - viser==1.1.1
