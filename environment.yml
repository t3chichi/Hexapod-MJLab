# Hexapod-MJLab 开发环境一键复现（conda env 名：hp_mjlab）。
# 版本为开发验证时的锁定组合；宽松约束见 pyproject.toml。
# 注：开发机 torch 为 cu128 wheel（2.11.0+cu128）；此处 pin 2.11.0 在
# Linux 上会从 PyPI 安装默认 CUDA 构建，功能等价。
name: hp_mjlab
channels:
  - defaults
dependencies:
  - python=3.12
  - pip
  - pip:
      - numpy==2.5.3
      - torch==2.11.0
      - warp-lang==1.17.0
      - scipy==1.18.1
      - trimesh==5.1.0
      - mujoco==3.11.0
      - mujoco-warp==3.11.0
      - mjlab==1.6.0
      - rsl-rl-lib==5.4.2
      - tensorboard==2.21.0
